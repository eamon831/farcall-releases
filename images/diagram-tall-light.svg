<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1100" width="100%" height="100%" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <filter id="shadow-tl" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1C1917" flood-opacity="0.04"/>
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#1C1917" flood-opacity="0.03"/>
    </filter>
    <!-- Emerald arrows -->
    <marker id="arr-em-end-tl" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 1 1.5 L 8 5 L 1 8.5" fill="none" stroke="#10B981" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-em-start-tl" viewBox="0 0 10 10" refX="3" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 9 1.5 L 2 5 L 9 8.5" fill="none" stroke="#10B981" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <!-- Terracotta arrows -->
    <marker id="arr-tc-end-tl" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 1 1.5 L 8 5 L 1 8.5" fill="none" stroke="#D2704A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-tc-start-tl" viewBox="0 0 10 10" refX="3" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 9 1.5 L 2 5 L 9 8.5" fill="none" stroke="#D2704A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <!-- Stone arrows -->
    <marker id="arr-st-end-tl" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 1 1.5 L 8 5 L 1 8.5" fill="none" stroke="#78716C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-st-start-tl" viewBox="0 0 10 10" refX="3" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 9 1.5 L 2 5 L 9 8.5" fill="none" stroke="#78716C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="600" height="1100" fill="#FBF8F6"/>

  <!-- 1. YOUR PHONE -->
  <g filter="url(#shadow-tl)">
    <rect x="110" y="32" width="380" height="116" rx="12" fill="#FFFFFF" stroke="#E6E1DA" stroke-width="1"/>
    <rect x="110.5" y="32.5" width="379" height="115" rx="11.5" fill="none" stroke="#D2704A" stroke-width="1.5" stroke-opacity="0.35"/>
  </g>
  <g transform="translate(142, 66)">
    <circle cx="24" cy="24" r="24" fill="#FDF3EE"/>
    <rect x="17" y="12" width="14" height="24" rx="2.5" fill="none" stroke="#D2704A" stroke-width="1.8"/>
    <line x1="22" y1="15" x2="26" y2="15" stroke="#D2704A" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="24" cy="32.5" r="1" fill="#D2704A"/>
  </g>
  <text x="206" y="82" font-size="18" font-weight="600" fill="#1C1917">Your phone</text>
  <text x="206" y="106" font-size="15" font-weight="500" fill="#D2704A">Farcall app</text>
  <rect x="394" y="76" width="72" height="26" rx="13" fill="#F4F0EC" stroke="#E6E1DA" stroke-width="1"/>
  <text x="430" y="93" text-anchor="middle" font-size="12.5" font-weight="500" fill="#57534E">Android</text>

  <!-- 2. PRIVATE TAILSCALE NETWORK (Phone <-> Computer) -->
  <line x1="300" y1="156" x2="300" y2="334" stroke="#10B981" stroke-width="2" stroke-dasharray="5 4" marker-start="url(#arr-em-start-tl)" marker-end="url(#arr-em-end-tl)"/>
  
  <g filter="url(#shadow-tl)">
    <rect x="120" y="180" width="360" height="130" rx="12" fill="#FFFFFF" stroke="#5CC48E" stroke-width="1.5"/>
    <rect x="120" y="180" width="360" height="130" rx="12" fill="#10B981" fill-opacity="0.04"/>
  </g>
  <!-- Shield Icon + Title inline -->
  <g transform="translate(158, 198)">
    <path d="M 12 2 L 22 5.5 L 22 12.5 C 22 18.5 17.8 23.2 12 25 C 6.2 23.2 2 18.5 2 12.5 L 2 5.5 Z" fill="#10B981" fill-opacity="0.12" stroke="#059669" stroke-width="1.6" stroke-linejoin="round"/>
    <rect x="9" y="12" width="6" height="5" rx="1" fill="#059669"/>
    <path d="M 10 12 L 10 10 C 10 8.8 10.8 8 12 8 C 13.2 8 14 8.8 14 10 L 14 12" fill="none" stroke="#059669" stroke-width="1.4"/>
    <text x="32" y="18" font-size="15.5" font-weight="600" fill="#065F46">Your private Tailscale network</text>
  </g>
  <text x="300" y="248" text-anchor="middle" font-size="14" fill="#44403C">messages, replies, approvals</text>
  <rect x="233" y="264" width="134" height="26" rx="13" fill="#10B981" fill-opacity="0.12"/>
  <text x="300" y="281" text-anchor="middle" font-size="12.5" font-weight="600" fill="#047857">no Farcall server</text>

  <!-- 3. YOUR COMPUTER (Outer Container) -->
  <rect x="60" y="344" width="480" height="444" rx="16" fill="#F4F0EC" stroke="#D6D0C8" stroke-width="1.5"/>
  
  <!-- Laptop Icon & Header -->
  <g transform="translate(205, 366)">
    <rect x="4" y="2" width="20" height="14" rx="2" fill="none" stroke="#57534E" stroke-width="1.8"/>
    <path d="M 1 19 L 27 19" stroke="#57534E" stroke-width="2" stroke-linecap="round"/>
    <text x="36" y="15" font-size="17" font-weight="600" fill="#1C1917">Your computer</text>
  </g>
  <text x="300" y="404" text-anchor="middle" font-size="13.5" fill="#78716C">Mac, Windows or Linux</text>

  <!-- 3A. FARCALL SERVICE CARD -->
  <g filter="url(#shadow-tl)">
    <rect x="100" y="424" width="400" height="126" rx="10" fill="#FFFFFF" stroke="#D2704A" stroke-width="1.5"/>
  </g>
  <g transform="translate(132, 463)">
    <circle cx="24" cy="24" r="24" fill="#FDF3EE"/>
    <rect x="13" y="15" width="22" height="18" rx="3" fill="none" stroke="#D2704A" stroke-width="1.8"/>
    <path d="M 17 21 L 21 24 L 17 27" fill="none" stroke="#D2704A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="23" y1="27" x2="28" y2="27" stroke="#D2704A" stroke-width="1.6" stroke-linecap="round"/>
  </g>
  <text x="196" y="481" font-size="17" font-weight="600" fill="#1C1917">Farcall</text>
  <text x="196" y="505" font-size="14.5" fill="#57534E">background service</text>

  <!-- Internal Computer Arrow (Farcall <-> Agent) -->
  <line x1="300" y1="558" x2="300" y2="602" stroke="#D2704A" stroke-width="2" marker-start="url(#arr-tc-start-tl)" marker-end="url(#arr-tc-end-tl)"/>

  <!-- 3B. CODING AGENT CARD -->
  <g filter="url(#shadow-tl)">
    <rect x="100" y="610" width="400" height="150" rx="10" fill="#FFFFFF" stroke="#E6E1DA" stroke-width="1.5"/>
  </g>
  <g transform="translate(132, 661)">
    <circle cx="24" cy="24" r="24" fill="#F4F0EC"/>
    <path d="M 13 17 C 13 15.8 13.8 15 15 15 L 20 15 L 22.5 18 L 33 18 C 34.2 18 35 18.8 35 20 L 35 31 C 35 32.2 34.2 33 33 33 L 15 33 C 13.8 33 13 32.2 13 31 Z" fill="none" stroke="#57534E" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M 21 23 L 18.5 25.5 L 21 28 M 27 23 L 29.5 25.5 L 27 28" fill="none" stroke="#D2704A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="196" y="662" font-size="17" font-weight="600" fill="#1C1917">Your coding agent</text>
  <text x="196" y="686" font-size="14.5" font-weight="500" fill="#D2704A">Claude Code or Codex</text>
  <rect x="196" y="704" width="164" height="28" rx="6" fill="#F4F0EC" stroke="#E6E1DA" stroke-width="1"/>
  <text x="278" y="722" text-anchor="middle" font-size="12.5" fill="#57534E">in your project folder</text>

  <!-- 4. CONNECTION TO AI PROVIDER (Agent <-> Provider) -->
  <line x1="300" y1="768" x2="300" y2="914" stroke="#78716C" stroke-width="2" marker-start="url(#arr-st-start-tl)" marker-end="url(#arr-st-end-tl)"/>

  <!-- Login / API Key Pill -->
  <g filter="url(#shadow-tl)">
    <rect x="180" y="816" width="240" height="52" rx="10" fill="#FFFFFF" stroke="#D6D0C8" stroke-width="1.5"/>
  </g>
  <g transform="translate(212, 833)">
    <circle cx="7" cy="9" r="4.5" fill="none" stroke="#78716C" stroke-width="1.6"/>
    <path d="M 11.5 9 L 21 9 M 18 9 L 18 12.5 M 21 9 L 21 12.5" fill="none" stroke="#78716C" stroke-width="1.6" stroke-linecap="round"/>
    <text x="32" y="14" font-size="14" font-weight="500" fill="#44403C">your login or API key</text>
  </g>

  <!-- 4. AI PROVIDER CARD -->
  <g filter="url(#shadow-tl)">
    <rect x="110" y="924" width="380" height="140" rx="12" fill="#FFFFFF" stroke="#E6E1DA" stroke-width="1.5"/>
  </g>
  <g transform="translate(142, 970)">
    <circle cx="24" cy="24" r="24" fill="#F4F0EC"/>
    <rect x="15" y="15" width="18" height="18" rx="3.5" fill="none" stroke="#57534E" stroke-width="1.8"/>
    <path d="M 19 12 L 19 15 M 24 12 L 24 15 M 29 12 L 29 15 M 19 33 L 19 36 M 24 33 L 24 36 M 29 33 L 29 36 M 12 19 L 15 19 M 12 24 L 15 24 M 12 29 L 15 29 M 33 19 L 36 19 M 33 24 L 36 24 M 33 29 L 36 29" stroke="#57534E" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="24" cy="24" r="3" fill="#D2704A"/>
  </g>
  <text x="206" y="974" font-size="17" font-weight="600" fill="#1C1917">Your AI provider</text>
  <text x="206" y="1000" font-size="14" fill="#57534E">Anthropic · OpenAI · Z.ai</text>
  <text x="206" y="1022" font-size="14" fill="#57534E">Moonshot · OpenRouter</text>
</svg>
